<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Staford Titus Selvaraj. Author of AMEP: evidence that AI agents stayed within their delegated authority.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAF6"/>
      <stop offset="0.6" stop-color="#F3F0E8"/>
      <stop offset="1" stop-color="#E8EEF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2F6FB0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2F6FB0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1B2A3A" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="44" y1="52" x2="384" y2="52">
      <stop offset="0" stop-color="#2F6FB0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#B65F14" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      .name { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 56px; fill: #14213D; letter-spacing: 0.5px; }
      .tag { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; fill: #4A5568; }
      .eyebrow { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 3px; fill: #B65F14; }
      .node { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #14213D; }
      .small { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #5B6B82; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#dots)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>
  <path d="M760 340 C 900 220, 1080 200, 1280 230 L1280 340 Z" fill="#2F6FB0" fill-opacity="0.06"/>
  <path d="M840 340 C 960 260, 1120 250, 1280 280 L1280 340 Z" fill="#B65F14" fill-opacity="0.05"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="18" fill="none" stroke="#DCD6CA"/>

  <text x="64" y="112" class="eyebrow">AGENT AUTHORITY · VERIFIABLE EVIDENCE</text>
  <text x="64" y="176" class="name">Staford Titus Selvaraj</text>
  <text x="64" y="222" class="tag">Checking afterwards that AI agents stayed</text>
  <text x="64" y="252" class="tag">within the authority they were given.</text>
  <text x="64" y="300" class="small">AMEP  ·  IETF INTERNET-DRAFT  ·  APACHE-2.0</text>

  <g transform="translate(790 118)">
    <path d="M44 52 H134 M178 52 H268 M312 52 H384" stroke="url(#line)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g>
      <rect x="0" y="22" width="88" height="60" rx="14" fill="#FFFDF8" stroke="#2F6FB0" stroke-width="1.5"/>
      <text x="44" y="57" text-anchor="middle" class="node">Person</text>
    </g>
    <g>
      <rect x="134" y="22" width="88" height="60" rx="14" fill="#FFFDF8" stroke="#2F6FB0" stroke-width="1.5"/>
      <text x="178" y="57" text-anchor="middle" class="node">Agent</text>
    </g>
    <g>
      <rect x="268" y="22" width="88" height="60" rx="14" fill="#FFFDF8" stroke="#2F6FB0" stroke-width="1.5"/>
      <text x="312" y="57" text-anchor="middle" class="node">Tool</text>
    </g>
    <g>
      <circle cx="414" cy="52" r="30" fill="#B65F14" fill-opacity="0.10" stroke="#B65F14" stroke-width="2"/>
      <path d="M400 52 l9 9 l18 -19" stroke="#B65F14" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="111" y="122" text-anchor="middle" class="small">SIGNED HAND-OFFS</text>
    <text x="312" y="122" text-anchor="middle" class="small">RECEIPT</text>
    <text x="414" y="122" text-anchor="middle" class="small">VERIFIED</text>
  </g>
</svg>
